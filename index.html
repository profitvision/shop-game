<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин у дома</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; margin: 0; padding: 10px; text-align: center; }
        h1 { color: #ffd700; font-size: 1.3em; margin: 5px 0; }
        .top-bar { display: flex; justify-content: space-around; background: #16213e; padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 0.9em; flex-wrap: wrap; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .shelf { background: #16213e; border-radius: 10px; padding: 10px; margin: 10px 0; }
        .shelf h3 { color: #ffd700; margin: 5px 0; }
        .shelf p { margin: 3px 0; font-size: 0.9em; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 8px; font-size: 0.95em; cursor: pointer; font-weight: bold; }
        .btn-buy { background: #27ae60; color: white; }
        .btn-price { background: #e67e22; color: white; }
        .btn-next { background: #e94560; color: white; }
        button:active { opacity: 0.8; }
        .log { background: #0a0a1a; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: left; font-size: 0.8em; max-height: 150px; overflow-y: auto; color: #aaa; }
        .green-text { color: #27ae60; }
        .red-text { color: #e74c3c; }
        .yellow-text { color: #ffd700; }
        input[type=range] { width: 80%; margin: 5px; }
        #priceDisplay { font-size: 1.2em; color: #ffd700; }
    </style>
</head>
<body>
    <h1>🏪 Магазин у дома</h1>
    
    <div class="top-bar">
        <div>💰 <span id="money">5000</span> руб.</div>
        <div>📅 День <span id="day">1</span>/30</div>
        <div>⭐ <span id="reputation">50</span></div>
        <div>📦 <span id="stock">0</span> шт.</div>
    </div>
    
    <div class="shelf">
        <h3>📥 Закупка товара</h3>
        <p>Цена закупки: <span id="costPrice">50</span> руб/шт.</p>
        <button class="btn-buy" onclick="buyGoods(5)">+5 шт. (дешевле)</button>
        <button class="btn-buy" onclick="buyGoods(10)">+10 шт.</button>
        <button class="btn-buy" onclick="buyGoods(20)">+20 шт. (оптом)</button>
    </div>
    
    <div class="shelf">
        <h3>💰 Цена продажи</h3>
        <p style="font-size:1.3em;"><span id="priceDisplay">75</span> руб/шт.</p>
        <input type="range" id="priceSlider" min="30" max="150" value="75" oninput="updatePrice()">
        <br>
        <button class="btn-price" onclick="setPrice(50)">📉 50 (дёшево)</button>
        <button class="btn-price" onclick="setPrice(75)">📊 75 (средне)</button>
        <button class="btn-price" onclick="setPrice(100)">📈 100 (дорого)</button>
        <button class="btn-price" onclick="setPrice(130)">💎 130 (премиум)</button>
    </div>
    
    <button class="btn-next" onclick="nextDay()">▶ Следующий день</button>
    <button class="btn-buy" onclick="restartGame()">🔄 Начать заново</button>
    
    <div class="log" id="log">🏪 Добро пожаловать! Заработайте максимум за 30 дней!</div>

    <script>
        var game = {
            money: 5000,
            stock: 0,
            costPrice: 50,
            sellPrice: 75,
            day: 1,
            reputation: 50,
            maxDays: 30
        };

        function updateUI() {
            document.getElementById("money").textContent = game.money;
            document.getElementById("day").textContent = game.day;
            document.getElementById("reputation").textContent = Math.floor(game.reputation);
            document.getElementById("stock").textContent = game.stock;
            document.getElementById("costPrice").textContent = game.costPrice;
            document.getElementById("priceDisplay").textContent = game.sellPrice;
            document.getElementById("priceSlider").value = game.sellPrice;
        }

        function addLog(msg, cls) {
            var log = document.getElementById("log");
            log.innerHTML = '<span class="' + (cls || '') + '">День ' + game.day + ':</span> ' + msg + '<br>' + log.innerHTML;
            if (log.children.length > 20) log.removeChild(log.lastChild);
        }

        function updatePrice() {
            game.sellPrice = parseInt(document.getElementById("priceSlider").value);
            updateUI();
        }

        function setPrice(p) { game.sellPrice = p; updateUI(); }

        function buyGoods(qty) {
            var discount = qty >= 20 ? 0.9 : qty >= 10 ? 0.95 : 1;
            var cost = Math.floor(qty * game.costPrice * discount);
            if (game.money >= cost) {
                game.money -= cost;
                game.stock += qty;
                addLog("Закуплено " + qty + " шт. за " + cost + " руб.", "green-text");
                game.costPrice = Math.floor(game.costPrice * 1.01) + 1;
            } else {
                addLog("Не хватает денег! Нужно " + cost + " руб.", "red-text");
            }
            updateUI();
        }

        function nextDay() {
            if (game.day >= game.maxDays) {
                endGame();
                return;
            }

            var customers = Math.floor(Math.random() * 10) + 5; // 5-15 покупателей
            var sold = 0;
            var earned = 0;
            var missed = 0;

            for (var i = 0; i < customers; i++) {
                if (game.stock <= 0) {
                    missed = customers - i;
                    break;
                }
                
                var marketPrice = Math.floor(Math.random() * 80) + 40; // 40-120 руб.
                var chance = 0;
                
                if (game.sellPrice <= marketPrice - 25) chance = 0.95;
                else if (game.sellPrice <= marketPrice - 10) chance = 0.8;
                else if (game.sellPrice <= marketPrice + 5) chance = 0.55;
                else if (game.sellPrice <= marketPrice + 20) chance = 0.25;
                else chance = 0.05;
                
                chance += game.reputation / 300;
                if (chance > 0.95) chance = 0.95;
                
                if (Math.random() < chance) {
                    game.stock--;
                    game.money += game.sellPrice;
                    sold++;
                    earned += game.sellPrice;
                    game.reputation = Math.min(100, game.reputation + 0.3);
                } else {
                    missed++;
                    game.reputation = Math.max(10, game.reputation - 0.5);
                }
            }

            // Аренда
            var rent = 50;
            game.money -= rent;

            if (sold > 0) {
                addLog(sold + " купили (+" + earned + " руб.), " + missed + " ушли. Аренда: -" + rent, "green-text");
            } else {
                addLog("Никто не купил! " + missed + " ушли. Аренда: -" + rent, "red-text");
            }

            game.day++;
            if (game.money <= 0 && game.stock === 0) {
                addLog("💸 БАНКРОТ!", "red-text");
                endGame();
            }
            updateUI();
        }

        function endGame() {
            var profit = game.money + game.stock * game.costPrice - 5000;
            var rating = "";
            if (profit > 30000) rating = "🏆 ИМПЕРИЯ БИЗНЕСА!";
            else if (profit > 15000) rating = "🥇 Отличный магазин!";
            else if (profit > 5000) rating = "🥈 Неплохой доход";
            else if (profit > 0) rating = "🥉 В следующий раз лучше";
            else rating = "😅 Бизнес — дело сложное...";

            document.getElementById("customersArea") ? null : null;
            var finalHTML = 
                '<div style="background:#ffd700; color:#1a1a2e; padding:20px; border-radius:10px; margin:10px 0;">' +
                '<h2>🏁 Игра окончена!</h2>' +
                '<p>💰 Деньги: <b>' + game.money + ' руб.</b></p>' +
                '<p>📦 Товара на складе: <b>' + game.stock + ' шт.</b></p>' +
                '<p>📊 Чистая прибыль: <b>' + profit + ' руб.</b></p>' +
                '<p style="font-size:1.3em;"><b>' + rating + '</b></p>' +
                '<p>⭐ Репутация: ' + Math.floor(game.reputation) + '</p>' +
                '</div>';
            
            document.getElementById("log").innerHTML = finalHTML + document.getElementById("log").innerHTML;
            document.querySelector(".btn-next").style.display = "none";
        }

        function restartGame() {
            game = {
                money: 5000,
                stock: 0,
                costPrice: 50,
                sellPrice: 75,
                day: 1,
                reputation: 50,
                maxDays: 30
            };
            document.getElementById("log").innerHTML = "🏪 Новая игра! 5000 руб., 30 дней. Удачи!";
            document.querySelector(".btn-next").style.display = "inline-block";
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
