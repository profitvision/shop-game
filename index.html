<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин у дома</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body {
            font-family: Arial;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 10px;
            text-align: center;
        }

        h1 {
            color: #ffd700;
            font-size: 1.3em;
            margin: 5px 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-around;
            background: #16213e;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .top-bar span {
            color: #ffd700;
            font-weight: bold;
        }

        .shelf {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }

        .shelf h3 {
            color: #ffd700;
            margin: 5px 0;
        }

        .shelf p {
            margin: 3px 0;
            font-size: 0.9em;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-buy {
            background: #27ae60;
            color: white;
        }

        .btn-sell {
            background: #3498db;
            color: white;
        }

        .btn-price {
            background: #e67e22;
            color: white;
        }

        .btn-next {
            background: #e94560;
            color: white;
        }

        button:active {
            opacity: 0.8;
        }

        .customer {
            background: #333;
            padding: 8px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .customer span {
            color: #ffd700;
        }

        .log {
            background: #0a0a1a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: left;
            font-size: 0.8em;
            max-height: 150px;
            overflow-y: auto;
            color: #aaa;
        }

        .green-text {
            color: #27ae60;
        }

        .red-text {
            color: #e74c3c;
        }

        .yellow-text {
            color: #ffd700;
        }

        input[type=range] {
            width: 80%;
            margin: 5px;
        }

        #priceDisplay {
            font-size: 1.2em;
            color: #ffd700;
        }
    </style>
</head>

<body>
    <h1>🏪 Магазин у дома</h1>

    <div class="top-bar">
        <div>💰 Деньги: <span id="money">5000</span> руб.</div>
        <div>📅 День: <span id="day">1</span>/30</div>
        <div>⭐ Репутация: <span id="reputation">50</span></div>
    </div>

    <div class="shelf">
        <h3>📦 Склад</h3>
        <p>Товара: <span id="stock">0</span> шт.</p>
        <p>Закупочная цена: <span id="costPrice">50</span> руб/шт.</p>
        <button class="btn-buy" onclick="buyGoods()">📥 Закупить 10 шт.</button>
    </div>

    <div class="shelf">
        <h3>💰 Продажа</h3>
        <p>Цена продажи: <span id="priceDisplay">75</span> руб/шт.</p>
        <input type="range" id="priceSlider" min="0" max="200" value="75" oninput="updatePrice()">
        <br>
        <button class="btn-price" onclick="setLowPrice()">📉 Дешево (55)</button>
        <button class="btn-price" onclick="setMidPrice()">📊 Средне (75)</button>
        <button class="btn-price" onclick="setHighPrice()">📈 Дорого (110)</button>
    </div>

    <div id="customersArea">
        <p style="color:#aaa;">Нажмите «Следующий день»</p>
    </div>

    <button class="btn-next" onclick="nextDay()">▶ Следующий день</button>
    <button class="btn-buy" onclick="restartGame()">🔄 Заново</button>

    <div class="log" id="log">Добро пожаловать в магазин! У вас 5000 руб. и 30 дней. Заработайте максимум!</div>

    <script>
        var game = {
            money: 5000,
            stock: 0,
            costPrice: 50,
            sellPrice: 75,
            day: 1,
            reputation: 50,
            maxDays: 30
        };

        function updateUI() {
            document.getElementById("money").textContent = game.money;
            document.getElementById("day").textContent = game.day;
            document.getElementById("reputation").textContent = game.reputation;
            document.getElementById("stock").textContent = game.stock;
            document.getElementById("costPrice").textContent = game.costPrice;
            document.getElementById("priceDisplay").textContent = game.sellPrice;
            document.getElementById("priceSlider").value = game.sellPrice;
        }

        function addLog(msg, cls) {
            var log = document.getElementById("log");
            log.innerHTML = '<span class="' + cls + '">День ' + game.day + ':</span> ' + msg + '<br>' + log.innerHTML;
        }

        function updatePrice() {
            game.sellPrice = parseInt(document.getElementById("priceSlider").value);
            updateUI();
        }

        function setLowPrice() { game.sellPrice = 55; updateUI(); }
        function setMidPrice() { game.sellPrice = 75; updateUI(); }
        function setHighPrice() { game.sellPrice = 110; updateUI(); }

        function buyGoods() {
            var cost = 10 * game.costPrice;
            if (game.money >= cost) {
                game.money -= cost;
                game.stock += 10;
                addLog("Закупили 10 шт. за " + cost + " руб.", "green-text");
                // Цена закупки немного растёт
                game.costPrice = Math.floor(game.costPrice * 1.02);
            } else {
                addLog("Не хватает денег на закупку!", "red-text");
            }
            updateUI();
        }

        function nextDay() {
            if (game.day >= game.maxDays) {
                endGame();
                return;
            }

            var customers = Math.floor(Math.random() * 8) + 2; // 2-10 покупателей
            var sold = 0;
            var earned = 0;

            for (var i = 0; i < customers; i++) {
                if (game.stock <= 0) break;

                // Покупатель сравнивает цену с рыночной (случайная 30-120)
                var marketPrice = Math.floor(Math.random() * 90) + 30;
                var chance = 0;

                if (game.sellPrice <= marketPrice - 20) chance = 0.9;  // Очень дёшево
                else if (game.sellPrice <= marketPrice) chance = 0.7;  // Дёшево
                else if (game.sellPrice <= marketPrice + 15) chance = 0.4; // Дороговато
                else chance = 0.1; // Очень дорого

                // Репутация влияет
                chance += game.reputation / 200;

                if (Math.random() < chance) {
                    game.stock--;
                    game.money += game.sellPrice;
                    sold++;
                    earned += game.sellPrice;
                    game.reputation = Math.min(100, game.reputation + 0.5);
                } else {
                    game.reputation = Math.max(0, game.reputation - 1);
                }
            }

            if (sold > 0) {
                addLog(sold + " из " + customers + " купили. Выручка: " + earned + " руб.", "green-text");
            } else if (game.stock > 0) {
                addLog("Никто не купил! Цена太高? Репутация: " + Math.floor(game.reputation), "red-text");
            } else {
                addLog("Товар закончился! Нечего продавать.", "red-text");
            }

            // Ежедневные расходы
            var rent = 100;
            game.money -= rent;

            game.day++;
            if (game.money < 0) {
                addLog("Вы банкрот! Игра окончена.", "red-text");
                endGame();
            }
            updateUI();
        }

        function endGame() {
            var profit = game.money - 5000;
            var rating = "";
            if (profit > 20000) rating = "🏆 Легенда торговли!";
            else if (profit > 10000) rating = "🥇 Отличный результат!";
            else if (profit > 5000) rating = "🥈 Хороший бизнес!";
            else if (profit > 0) rating = "🥉 Можно лучше";
            else rating = "😅 Бизнес не пошёл...";

            document.getElementById("customersArea").innerHTML =
                '<div style="background:#ffd700; color:#1a1a2e; padding:20px; border-radius:10px; margin:10px 0;">' +
                '<h2>Игра окончена!</h2>' +
                '<p>Деньги: <b>' + game.money + ' руб.</b></p>' +
                '<p>Прибыль: <b>' + profit + ' руб.</b></p>' +
                '<p style="font-size:1.2em;"><b>' + rating + '</b></p>' +
                '</div>';

            document.querySelector(".btn-next").style.display = "none";
            addLog("Игра окончена. Прибыль: " + profit + " руб. " + rating, "yellow-text");
        }

        function restartGame() {
            game = {
                money: 5000,
                stock: 0,
                costPrice: 50,
                sellPrice: 75,
                day: 1,
                reputation: 50,
                maxDays: 30
            };
            document.getElementById("log").innerHTML = "Новая игра! У вас 5000 руб. и 30 дней.";
            document.getElementById("customersArea").innerHTML = '<p style="color:#aaa;">Нажмите «Следующий день»</p>';
            document.querySelector(".btn-next").style.display = "inline-block";
            updateUI();
        }

        updateUI();
    </script>
</body>

</html>
